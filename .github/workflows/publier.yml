# Publication de l'appli sur GitHub Pages à chaque envoi sur main.
# Les tests (dont la validation de toutes les questions) passent d'abord :
# s'ils échouent, rien n'est publié.
name: Publier l'appli

on:
  push:
    branches: [main]
  workflow_dispatch:

# Droits accordés job par job, au plus juste.
permissions: {}

# Une seule publication à la fois ; une publication en cours n'est pas interrompue.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@v4
